version: '3.8'

services:
  # Backend Django service
  backend:
    build: ./backend
    container_name: aussiz-isms-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/static:/app/static
      - ./backend/media:/app/media
    env_file:
      - ./.env
    depends_on:
      - postgres
      - redis
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  # Frontend Next.js service
  frontend:
    build: ./frontend
    container_name: aussiz-isms-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./.env
    depends_on:
      - backend
    command: npm run dev

  # PostgreSQL database
  postgres:
    image: postgres:15
    container_name: aussiz-isms-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./.env
    environment:
      - POSTGRES_DB=aussiz_isms
      - POSTGRES_USER=aussiz_user
      - POSTGRES_PASSWORD=aussiz_password

  # Redis for Celery and caching
  redis:
    image: redis:7-alpine
    container_name: aussiz-isms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Celery worker for background tasks
  celery:
    build: ./backend
    container_name: aussiz-isms-celery
    volumes:
      - ./backend:/app
    env_file:
      - ./.env
    depends_on:
      - postgres
      - redis
    command: celery -A config worker -l info

  # Celery beat for periodic tasks
  celery-beat:
    build: ./backend
    container_name: aussiz-isms-celery-beat
    volumes:
      - ./backend:/app
    env_file:
      - ./.env
    depends_on:
      - postgres
      - redis
    command: celery -A config beat -l info

volumes:
  postgres_data:
  redis_data: